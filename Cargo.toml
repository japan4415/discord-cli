[package]
name = "discord-cli"
version = "1.0.1"
edition = "2021"
description = "A comprehensive Discord REST API CLI tool"
authors = ["Yoshihiko Kato"]
repository = "https://github.com/japan4415/discord-cli"
homepage = "https://github.com/japan4415/discord-cli"
license = "Apache-2.0"
keywords = ["discord", "cli", "api", "bot"]
categories = ["command-line-utilities"]
exclude = [".github", ".claude", ".env", ".env.example"]

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json", "multipart", "query", "rustls", "webpki-roots"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tabled = { version = "0.21", default-features = false, features = ["derive"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
urlencoding = "2.1.3"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
